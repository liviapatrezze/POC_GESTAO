services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: poc_gestao
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc -d poc_gestao"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

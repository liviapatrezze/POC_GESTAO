<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Esporte</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        .topo {
            background: #1f2937;
            color: white;
            padding: 20px 30px;
        }

        .topo h1 {
            margin: 0;
            font-size: 24px;
        }

        .topo p {
            margin: 5px 0 0;
            color: #d1d5db;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #1f2937;
        }

        .mensagem {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
            border-radius: 7px;
            padding: 12px 15px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo-completo {
            grid-column: 1 / -1;
        }

        .campo label {
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        .campo input,
        .campo textarea,
        .campo select {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            font-family: Arial, Helvetica, sans-serif;
        }

        .campo textarea {
            min-height: 120px;
            resize: vertical;
        }

        .campo input:focus,
        .campo textarea:focus,
        .campo select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        .campo input[type="file"] {
            padding: 9px;
            background: white;
            cursor: pointer;
        }

        .ajuda {
            margin-top: 6px;
            font-size: 13px;
            color: #6b7280;
        }

        .botoes {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
        }

        .botao {
            padding: 12px 22px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
        }

        .botao-voltar {
            background: #e5e7eb;
            color: #374151;
        }

        .botao-voltar:hover {
            background: #d1d5db;
        }

        .botao-salvar {
            background: #2563eb;
            color: white;
        }

        .botao-salvar:hover {
            background: #1d4ed8;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .campo-completo {
                grid-column: auto;
            }

            .botoes {
                flex-direction: column;
            }

            .botao {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="topo">
        <h1>Gestão Esportiva</h1>
        <p>Cadastro de esportes</p>
    </div>

    <div class="container">

        <div class="card">

            <h2>Novo esporte</h2>

            {% if messages %}
                {% for message in messages %}
                    <div class="mensagem">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form
                method="POST"
                enctype="multipart/form-data"
            >

                {% csrf_token %}

                <div class="form-grid">

                    <!-- NOME -->
                    <div class="campo campo-completo">

                        <label for="nome">
                            Nome do esporte
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            maxlength="150"
                            required
                        >

                    </div>

                    <!-- CATEGORIA -->
                    <div class="campo">

                        <label for="categoria">
                            Categoria
                        </label>

                        <input
                            type="text"
                            id="categoria"
                            name="categoria"
                            maxlength="100"
                            placeholder="Ex.: Coletivo"
                        >

                    </div>

                    <!-- IMAGEM -->
                    <div class="campo">

                        <label for="imagem">
                            Imagem do esporte
                        </label>

                        <input
                            type="file"
                            id="imagem"
                            name="imagem"
                            accept="image/*"
                        >

                        <span class="ajuda">
                            Imagem opcional.
                        </span>

                    </div>

                    <!-- DESCRIÇÃO -->
                    <div class="campo campo-completo">

                        <label for="descricao">
                            Descrição
                        </label>

                        <textarea
                            id="descricao"
                            name="descricao"
                            placeholder="Descreva brevemente o esporte..."
                        ></textarea>

                    </div>

                </div>

                <div class="botoes">

                    <a
                        href="{% url 'lista_esportes' %}"
                        class="botao botao-voltar"
                    >
                        Voltar
                    </a>

                    <button
                        type="submit"
                        class="botao botao-salvar"
                    >
                        Cadastrar esporte
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>
</html>

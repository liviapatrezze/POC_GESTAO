<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Horário</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        .descricao {
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #198754;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #157347;
        }

        .mensagem {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .sucesso {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .erro {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
            color: #333;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="container">

        {% if messages %}

            {% for message in messages %}

                <div class="mensagem
                    {% if message.tags == 'success' %}
                        sucesso
                    {% else %}
                        erro
                    {% endif %}
                ">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}


        <h1>Cadastrar Horário</h1>

        <p class="descricao">
            Cadastre o dia e o horário de uma aula,
            vinculando um esporte a um professor.
        </p>


        <form method="POST">

            {% csrf_token %}


            <label for="esporte">
                Esporte
            </label>

            <select
                id="esporte"
                name="esporte"
                required
            >

                <option value="">
                    Selecione um esporte
                </option>

                {% for esporte in esportes %}

                    <option value="{{ esporte.id }}">
                        {{ esporte.nome }}
                    </option>

                {% endfor %}

            </select>


            <label for="professor">
                Professor
            </label>

            <select
                id="professor"
                name="professor"
                required
            >

                <option value="">
                    Selecione um professor
                </option>

                {% for professor in professores %}

                    <option value="{{ professor.id }}">
                        {{ professor.nome }}
                    </option>

                {% endfor %}

            </select>


            <label for="dia_semana">
                Dia da semana
            </label>

            <select
                id="dia_semana"
                name="dia_semana"
                required
            >

                <option value="">
                    Selecione o dia
                </option>

                <option value="SEG">
                    Segunda-feira
                </option>

                <option value="TER">
                    Terça-feira
                </option>

                <option value="QUA">
                    Quarta-feira
                </option>

                <option value="QUI">
                    Quinta-feira
                </option>

                <option value="SEX">
                    Sexta-feira
                </option>

                <option value="SAB">
                    Sábado
                </option>

                <option value="DOM">
                    Domingo
                </option>

            </select>


            <label for="hora_inicio">
                Hora de início
            </label>

            <input
                type="time"
                id="hora_inicio"
                name="hora_inicio"
                required
            >


            <label for="hora_fim">
                Hora de término
            </label>

            <input
                type="time"
                id="hora_fim"
                name="hora_fim"
                required
            >


            <button type="submit">
                Cadastrar Horário
            </button>

        </form>


        <a
            href="{% url 'lista_horarios' %}"
            class="voltar"
        >
            ← Voltar para horários
        </a>

    </div>

</body>

</html>

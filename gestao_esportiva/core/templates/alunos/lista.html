<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Alunos</title>

</head>

<body>

    <h1>Alunos cadastrados</h1>

    <!-- ===================================================== -->
    <!-- LOGOUT -->
    <!-- ===================================================== -->

    <form method="post" action="{% url 'logout' %}">

        {% csrf_token %}

        <button type="submit">
            Sair
        </button>

    </form>

    <hr>


    <!-- ===================================================== -->
    <!-- CADASTRAR ALUNO -->
    <!-- ===================================================== -->

    <a href="{% url 'cadastrar_aluno' %}">
        Cadastrar novo aluno
    </a>

    <hr>


    <!-- ===================================================== -->
    <!-- LISTA DE ALUNOS -->
    <!-- ===================================================== -->

    {% if alunos %}

        <table border="1" cellpadding="8">

            <thead>

                <tr>

                    <th>Nome</th>

                    <th>CPF</th>

                    <th>Telefone</th>

                    <th>E-mail</th>

                </tr>

            </thead>


            <tbody>

                {% for aluno in alunos %}

                    <tr>

                        <td>
                            {{ aluno.nome }}
                        </td>

                        <td>
                            {{ aluno.cpf }}
                        </td>

                        <td>
                            {{ aluno.telefone }}
                        </td>

                        <td>
                            {{ aluno.email }}
                        </td>

                    </tr>

                {% endfor %}

            </tbody>

        </table>

    {% else %}

        <p>
            Nenhum aluno cadastrado ainda.
        </p>

    {% endif %}


</body>

</html>

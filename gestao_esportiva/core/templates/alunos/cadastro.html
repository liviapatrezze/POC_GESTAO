<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Aluno</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        .topo {
            background: #1f2937;
            color: white;
            padding: 20px 30px;
        }

        .topo h1 {
            margin: 0;
            font-size: 24px;
        }

        .topo p {
            margin: 5px 0 0;
            color: #d1d5db;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #1f2937;
        }

        /* MENSAGEM */
        .mensagem {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #f59e0b;
            border-radius: 7px;
            padding: 12px 15px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        .campo input {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        .campo input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        .campo-completo {
            grid-column: 1 / -1;
        }

        .botoes {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
        }

        .botao {
            padding: 12px 22px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
        }

        .botao-voltar {
            background: #e5e7eb;
            color: #374151;
        }

        .botao-voltar:hover {
            background: #d1d5db;
        }

        .botao-salvar {
            background: #2563eb;
            color: white;
        }

        .botao-salvar:hover {
            background: #1d4ed8;
        }

        .campo select {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        .campo select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        /* CAMPO DE FOTO */
        .campo input[type="file"] {
            padding: 9px;
            background: white;
            cursor: pointer;
        }

        .ajuda-foto {
            margin-top: 6px;
            font-size: 13px;
            color: #6b7280;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .campo-completo {
                grid-column: auto;
            }

            .botoes {
                flex-direction: column;
            }

            .botao {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="topo">
        <h1>Gestão Esportiva</h1>
        <p>Cadastro de alunos</p>
    </div>

    <div class="container">

        <div class="card">

            <h2>Novo aluno</h2>

            <!-- MENSAGEM DE ERRO -->
            {% if messages %}
                {% for message in messages %}
                    <div class="mensagem">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <div class="form-grid">

                    <!-- NOME -->
                    <div class="campo campo-completo">
                        <label for="nome">Nome completo</label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            maxlength="150"
                            required
                        >
                    </div>

                    <!-- CPF -->
                    <div class="campo">
                        <label for="cpf">CPF</label>

                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            maxlength="14"
                            placeholder="000.000.000-00"
                            required
                        >
                    </div>

                    <!-- TELEFONE -->
                    <div class="campo">
                        <label for="telefone">Telefone</label>

                        <input
                            type="text"
                            id="telefone"
                            name="telefone"
                            maxlength="15"
                            placeholder="(00) 00000-0000"
                        >
                    </div>

                    <!-- E-MAIL -->
                    <div class="campo campo-completo">
                        <label for="email">E-mail</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            maxlength="254"
                        >
                    </div>

                    <!-- DATA DE NASCIMENTO -->
                    <div class="campo">
                        <label for="data_nascimento">Data de nascimento</label>

                        <input
                            type="date"
                            id="data_nascimento"
                            name="data_nascimento"
                        >
                    </div>

                    <!-- ENDEREÇO -->
                    <div class="campo">
                        <label for="endereco">Endereço</label>

                        <input
                            type="text"
                            id="endereco"
                            name="endereco"
                            maxlength="200"
                            required
                        >
                    </div>

                    <!-- NÚMERO -->
                    <div class="campo">
                        <label for="numero">Número</label>

                        <input
                            type="text"
                            id="numero"
                            name="numero"
                            maxlength="10"
                            required
                        >
                    </div>

                    <!-- BAIRRO -->
                    <div class="campo">
                        <label for="bairro">Bairro</label>

                        <input
                            type="text"
                            id="bairro"
                            name="bairro"
                            maxlength="100"
                        >
                    </div>

                    <!-- CIDADE -->
                    <div class="campo">
                        <label for="cidade">Cidade</label>

                        <input
                            type="text"
                            id="cidade"
                            name="cidade"
                            maxlength="100"
                        >
                    </div>

                    <!-- ESTADO -->
                    <div class="campo">
                        <label for="estado">Estado</label>

                        <select
                            id="estado"
                            name="estado"
                            required
                        >
                            <option value="">Selecione</option>
                            <option value="AC">AC</option>
                            <option value="AL">AL</option>
                            <option value="AP">AP</option>
                            <option value="AM">AM</option>
                            <option value="BA">BA</option>
                            <option value="CE">CE</option>
                            <option value="DF">DF</option>
                            <option value="ES">ES</option>
                            <option value="GO">GO</option>
                            <option value="MA">MA</option>
                            <option value="MT">MT</option>
                            <option value="MS">MS</option>
                            <option value="MG">MG</option>
                            <option value="PA">PA</option>
                            <option value="PB">PB</option>
                            <option value="PR">PR</option>
                            <option value="PE">PE</option>
                            <option value="PI">PI</option>
                            <option value="RJ">RJ</option>
                            <option value="RN">RN</option>
                            <option value="RS">RS</option>
                            <option value="RO">RO</option>
                            <option value="RR">RR</option>
                            <option value="SC">SC</option>
                            <option value="SP">SP</option>
                            <option value="SE">SE</option>
                            <option value="TO">TO</option>
                        </select>
                    </div>

                    <!-- FOTO -->
                    <div class="campo campo-completo">
                        <label for="imagem">Foto do aluno</label>

                        <input
                            type="file"
                            id="imagem"
                            name="imagem"
                            accept="image/*"
                        >

                        <span class="ajuda-foto">
                            Selecione uma foto do aluno (opcional).
                        </span>
                    </div>

                </div>

                <div class="botoes">

                    <a
                        href="{% url 'lista_alunos' %}"
                        class="botao botao-voltar"
                    >
                        Voltar
                    </a>

                    <button
                        type="submit"
                        class="botao botao-salvar"
                    >
                        Cadastrar aluno
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script>

        // =========================
        // MÁSCARA DE CPF
        // =========================

        const cpf = document.getElementById("cpf");

        cpf.addEventListener("input", function () {

            let valor = cpf.value.replace(/\D/g, "");

            valor = valor.substring(0, 11);

            if (valor.length > 9) {
                valor = valor.replace(
                    /^(\d{3})(\d{3})(\d{3})(\d{1,2}).*/,
                    "$1.$2.$3-$4"
                );
            } else if (valor.length > 6) {
                valor = valor.replace(
                    /^(\d{3})(\d{3})(\d{1,3}).*/,
                    "$1.$2.$3"
                );
            } else if (valor.length > 3) {
                valor = valor.replace(
                    /^(\d{3})(\d{1,3}).*/,
                    "$1.$2"
                );
            }

            cpf.value = valor;
        });


        // =========================
        // MÁSCARA DE TELEFONE
        // =========================

        const telefone = document.getElementById("telefone");

        telefone.addEventListener("input", function () {

            let valor = telefone.value.replace(/\D/g, "");

            valor = valor.substring(0, 11);

            if (valor.length > 10) {

                valor = valor.replace(
                    /^(\d{2})(\d{5})(\d{4}).*/,
                    "($1) $2-$3"
                );

            } else if (valor.length > 6) {

                valor = valor.replace(
                    /^(\d{2})(\d{4})(\d{1,4}).*/,
                    "($1) $2-$3"
                );

            } else if (valor.length > 2) {

                valor = valor.replace(
                    /^(\d{2})(\d{1,5}).*/,
                    "($1) $2"
                );

            }

            telefone.value = valor;
        });


        // =========================
        // LIMPAR MÁSCARAS ANTES DE ENVIAR
        // =========================

        const formulario = document.querySelector("form");

        formulario.addEventListener("submit", function () {

            cpf.value = cpf.value.replace(/\D/g, "");

            telefone.value = telefone.value.replace(/\D/g, "");

        });

    </script>

</body>
</html>

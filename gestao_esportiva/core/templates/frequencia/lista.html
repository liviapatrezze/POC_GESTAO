<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle de Frequência</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            margin-bottom: 10px;
        }

        .descricao {
            margin-bottom: 25px;
            color: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #eee;
        }

        .foto-aluno {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #ddd;
        }

        .sem-foto {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #666;
            text-align: center;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 5px;
        }

        .presente {
            background-color: #4caf50;
            color: white;
        }

        .ausente {
            background-color: #f44336;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }

        .resultado {
            font-weight: bold;
        }

        .resultado.presente-status {
            color: #2e7d32;
        }

        .resultado.ausente-status {
            color: #c62828;
        }

        #mensagem {
            margin-bottom: 15px;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <h1>Controle de Frequência</h1>

    <p class="descricao">
        Registre a presença ou ausência dos alunos nas aulas.
    </p>

    <div id="mensagem">
        Carregando alunos...
    </div>


    <table>

        <thead>

            <tr>
                <th>Foto</th>
                <th>Aluno</th>
                <th>Esporte</th>
                <th>Professor</th>
                <th>Dia</th>
                <th>Horário</th>
                <th>Presença</th>
                <th>Ação</th>
            </tr>

        </thead>


        <tbody id="tabela-frequencia">
        </tbody>

    </table>


    <script>

        function carregarFrequencia() {

            fetch("/api/matriculas/")

                .then(response => response.json())

                .then(data => {

                    const tabela =
                        document.getElementById("tabela-frequencia");

                    const mensagem =
                        document.getElementById("mensagem");


                    tabela.innerHTML = "";

                    mensagem.textContent = "";


                    data.matriculas.forEach(matricula => {

                        const linha =
                            document.createElement("tr");


                        // ==================================================
                        // FOTO DO ALUNO
                        // ==================================================

                        let fotoHTML;


                        if (matricula.foto) {

                            fotoHTML = `
                                <img
                                    src="${matricula.foto}"
                                    alt="Foto de ${matricula.aluno}"
                                    class="foto-aluno"
                                >
                            `;

                        } else {

                            fotoHTML = `
                                <div class="sem-foto">
                                    Sem foto
                                </div>
                            `;

                        }


                        // ==================================================
                        // STATUS DA FREQUÊNCIA
                        // ==================================================

                        let resultadoHTML = "-";

                        let classeResultado = "";


                        if (matricula.presente === true) {

                            resultadoHTML = "Presente";

                            classeResultado = "presente-status";

                        }

                        else if (matricula.presente === false) {

                            resultadoHTML = "Ausente";

                            classeResultado = "ausente-status";

                        }


                        // ==================================================
                        // MONTA A LINHA
                        // ==================================================

                        linha.innerHTML = `

                            <td>
                                ${fotoHTML}
                            </td>

                            <td>
                                ${matricula.aluno}
                            </td>

                            <td>
                                ${matricula.esporte}
                            </td>

                            <td>
                                ${matricula.professor}
                            </td>

                            <td>
                                ${matricula.dia_semana}
                            </td>

                            <td>
                                ${matricula.hora_inicio}
                                às
                                ${matricula.hora_fim}
                            </td>

                            <td
                                class="resultado ${classeResultado}"
                                id="resultado-${matricula.id}">
                                ${resultadoHTML}
                            </td>

                            <td>

                                <button
                                    class="presente"
                                    onclick="registrarPresenca(
                                        ${matricula.id},
                                        true
                                    )">
                                    Presente
                                </button>

                                <button
                                    class="ausente"
                                    onclick="registrarPresenca(
                                        ${matricula.id},
                                        false
                                    )">
                                    Ausente
                                </button>

                            </td>

                        `;


                        tabela.appendChild(linha);

                    });

                })

                .catch(error => {

                    console.error(error);

                    document.getElementById("mensagem").textContent =
                        "Erro ao carregar os alunos.";

                });

        }


        // ==========================================================
        // REGISTRAR PRESENÇA
        // ==========================================================

        function registrarPresenca(matriculaId, presente) {

            const dados = new URLSearchParams();


            dados.append(
                "matricula_id",
                matriculaId
            );


            dados.append(
                "presente",
                presente
            );


            fetch("/api/presenca/", {

                method: "POST",

                body: dados

            })

            .then(response => response.json())

            .then(data => {

                if (data.sucesso) {

                    const resultado =
                        document.getElementById(
                            `resultado-${matriculaId}`
                        );


                    // Remove as classes anteriores

                    resultado.classList.remove(
                        "presente-status",
                        "ausente-status"
                    );


                    // Atualiza o resultado

                    if (data.presente) {

                        resultado.textContent =
                            "Presente";

                        resultado.classList.add(
                            "presente-status"
                        );

                    }

                    else {

                        resultado.textContent =
                            "Ausente";

                        resultado.classList.add(
                            "ausente-status"
                        );

                    }

                }

                else {

                    alert(
                        "Não foi possível registrar a frequência."
                    );

                }

            })

            .catch(error => {

                console.error(error);

                alert(
                    "Ocorreu um erro ao registrar a frequência."
                );

            });

        }


        // ==========================================================
        // CARREGA A FREQUÊNCIA AO ABRIR A PÁGINA
        // ==========================================================

        carregarFrequencia();

    </script>

</body>

</html>
